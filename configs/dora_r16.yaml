# Arm C — DoRA (weight-decomposed LoRA) on a 4-bit base.
# Fixed across all arms: 3 epochs, lr 2e-4, seed 42, cosine, warmup 0.03.
method: dora

model:
  name_or_path: liuhaotian/llava-v1.5-7b
  vision_tower: openai/clip-vit-large-patch14-336
  mm_projector_type: mlp2x_gelu
  model_max_length: 2048

quantization:
  bits: 4
  double_quant: true
  quant_type: nf4
  compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32       # alpha = 2x r, same ratio in every arm
  dropout: 0.05
  bias: none
  use_dora: true
  target_modules: all-linear  # LLaVA find_all_linear_names()

training:
  num_train_epochs: 3
  learning_rate: 2.0e-04
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  eval_steps: 100
  save_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  output_dir: checkpoints/llava-mvtec-dora-r16

data:
  train_file: mvtec_train.json            # decontaminate: drop ids present in eval_test.json
  eval_file: eval_test.json
  image_folder: mvtec_anomaly_detection

seed: 42

notes: >
  REQUIRES a one-line patch: upstream LLaVA/llava/train/train.py builds a
  plain LoraConfig with no use_dora flag. Add use_dora=True to that
  LoraConfig and use peft>=0.9 (DoRA support). train_mvtec.py warns and
  falls back to LoRA if the patch is absent. DoRA trains slightly slower
  than LoRA (magnitude+direction decomposition) at equal r.
