# Arm A — plain LoRA (no quantization). Baseline for "what does 4-bit cost?".
# Fixed across all arms: 3 epochs, lr 2e-4, seed 42, cosine, warmup 0.03.
method: lora

model:
  name_or_path: liuhaotian/llava-v1.5-7b
  vision_tower: openai/clip-vit-large-patch14-336
  mm_projector_type: mlp2x_gelu
  model_max_length: 2048

quantization:
  bits: 16        # no quantization for this arm
  double_quant: false
  quant_type: nf4 # unused when bits=16, kept for schema parity

lora:
  r: 16
  alpha: 32       # alpha = 2x r, same ratio in every arm
  dropout: 0.05
  bias: none
  target_modules: all-linear  # LLaVA find_all_linear_names()

training:
  num_train_epochs: 3
  learning_rate: 2.0e-04
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  eval_steps: 100
  save_steps: 100
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  output_dir: checkpoints/llava-mvtec-lora-r16

data:
  train_file: mvtec_train.json            # decontaminate: drop ids present in eval_test.json
  eval_file: eval_test.json
  image_folder: mvtec_anomaly_detection

seed: 42

notes: >
  Needs ~2x the VRAM of the QLoRA arm (no 4-bit base). If OOM on a T4-16GB,
  halve per_device_train_batch_size and double gradient_accumulation_steps —
  global batch size stays identical, so the comparison remains fair.
