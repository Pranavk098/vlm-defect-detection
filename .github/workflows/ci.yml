# .github/workflows/ci.yml
#
# Runs on every push and pull request to main.
#
# Jobs (all run on ubuntu-latest, no GPU):
#   1. lint          — ruff check + format (E, F, I; E501 ignored)
#   2. import-check  — verify vlm_defect modules and config load cleanly
#   3. smoke-test    — run prepare_data on a tiny mock dataset; validate JSON
#   4. app-check     — verify src/vlm_defect/app.py imports without errors
#
# Training is excluded — it requires a GPU and model weights from HF Hub.
#
# Dependency strategy
# -------------------
# torch is installed from the PyTorch CPU wheel index.  All other packages
# (pyyaml, pillow, numpy, transformers, …) are installed from PyPI first so
# that --index-url does not shadow them (--index-url REPLACES PyPI entirely;
# --extra-index-url augments it, but splitting into two pip calls is clearer).

name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check (errors block CI)
        run: ruff check src/ scripts/ --select E,F,I --ignore E501

      - name: Format (warnings only)
        run: ruff format --check src/ scripts/ || true

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Import & config check
  # ─────────────────────────────────────────────────────────────────────────
  import-check:
    name: Import & Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Non-torch packages from PyPI
          pip install pyyaml pillow numpy scikit-learn sentencepiece protobuf
          # transformers + peft: needed so trainer.py / model.py can be imported
          pip install "transformers>=4.37.2" "peft>=0.9.0" "accelerate>=0.27.2"
          # CPU-only torch from the PyTorch wheel server
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Install the vlm_defect package itself (base deps only)
          pip install -e .

      - name: Check vlm_defect module imports
        run: |
          python -c "from vlm_defect.data import create_dataset, MVTecDataset, collate_fn; print('OK  data.py')"
          python -c "from vlm_defect.cli  import prepare, train, eval, app;               print('OK  cli.py')"
          python -c "from vlm_defect.model import load_model_and_processor;                print('OK  model.py')"

      - name: Validate config/local_8gb.yaml structure
        run: |
          python - <<'EOF'
          import yaml
          with open("configs/local_8gb.yaml") as f:
              cfg = yaml.safe_load(f)

          required = ["model", "quantization", "lora", "data", "training"]
          for section in required:
              assert section in cfg, f"Missing config section: {section}"
              print(f"  OK  {section}")

          assert "name_or_path"  in cfg["model"],        "Missing model.name_or_path"
          assert "path"          in cfg["data"],          "Missing data.path"
          assert "image_folder"  in cfg["data"],          "Missing data.image_folder"
          assert cfg["lora"]["r"] > 0,                    "lora.r must be positive"
          print("  All config checks passed.")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Smoke test — prepare_data on a tiny mock dataset
  # ─────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (Mock Data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pillow
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Create mock MVTec dataset (2 categories, minimal images)
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image

          for cat in ["bottle", "cable"]:
              for split, color in [
                  ("train/good",  (0,  200, 0)),
                  ("test/good",   (0,  255, 0)),
              ]:
                  p = Path(f"mvtec_anomaly_detection/{cat}/{split}")
                  p.mkdir(parents=True, exist_ok=True)
                  for i in range(3):
                      Image.new("RGB", (64, 64), color=color).save(p / f"{i:03d}.png")

              broken = Path(f"mvtec_anomaly_detection/{cat}/test/broken")
              broken.mkdir(parents=True, exist_ok=True)
              for i in range(2):
                  Image.new("RGB", (64, 64), color=(255, 0, 0)).save(broken / f"{i:03d}.png")

          print("Mock dataset created.")
          EOF

      - name: Run prepare_data with correct flags
        run: |
          python scripts/prepare_data.py \
            --dataset-root mvtec_anomaly_detection \
            --output-train data/mvtec_train.json \
            --output-test  data/mvtec_test.json

      - name: Validate generated JSON
        run: |
          python - <<'EOF'
          import json

          for name, path in [("train", "data/mvtec_train.json"), ("test", "data/mvtec_test.json")]:
              with open(path) as f:
                  data = json.load(f)

              assert len(data) > 0, f"No samples in {path}"

              for item in data[:3]:
                  assert "id"            in item
                  assert "image"         in item
                  assert "conversations" in item
                  assert len(item["conversations"]) == 2

              answers = [d["conversations"][1]["value"] for d in data]
              print(f"  {name}: {len(data)} samples  "
                    f"({sum(1 for a in answers if 'No' in a)} normal / "
                    f"{sum(1 for a in answers if 'Yes' in a)} anomaly)")

          print("JSON structure validated.")
          EOF

  # ─────────────────────────────────────────────────────────────────────────
  # 4. App import check
  # ─────────────────────────────────────────────────────────────────────────
  app-check:
    name: Gradio App Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # app.py imports numpy directly; evaluate.py (imported by app.py) needs
          # transformers.BitsAndBytesConfig and sklearn.metrics.roc_auc_score
          pip install pyyaml pillow numpy gradio matplotlib scikit-learn sentencepiece
          pip install "transformers>=4.37.2"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Verify app.py imports cleanly
        run: |
          python - <<'EOF'
          import importlib.util, sys

          spec = importlib.util.spec_from_file_location("vlm_app", "src/vlm_defect/app.py")
          mod  = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(mod)
          except Exception as exc:
              # Model-loading errors (no GPU, no weights) are expected in CI.
              # Only fail on import or syntax errors in our own code.
              if isinstance(exc, (ImportError, SyntaxError)):
                  print(f"FAIL: {exc}", file=sys.stderr)
                  raise SystemExit(1)
          print("OK  src/vlm_defect/app.py imports successfully")
          EOF
